name: Monitor Tiqets

on:
  schedule:
    - cron: '*/5 * * * *' # toutes les 5 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tiqets-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check availability
        env:
          TIQETS_COOKIE: ${{ secrets.TIQETS_COOKIE }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          STATE_FILE: data/state.json
        run: |
          set -euo pipefail

          git config user.name "tiqets-monitor-bot"
          git config user.email "tiqets-monitor-bot@users.noreply.github.com"

          bash ./monitor-tiqets.sh

          git add data/state.json

          if ! git diff --staged --quiet; then
            git commit -m "chore: update Tiqets monitor state"
            git push origin main
          else
            echo "Aucun changement d'état à pousser."
          fi