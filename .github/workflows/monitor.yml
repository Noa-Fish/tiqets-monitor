name: Monitor Tiqets

on:
  schedule:
    - cron: '*/5 * * * *'  # toutes les 5 minutes
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check availability
        env:
          TIQETS_COOKIE: ${{ secrets.TIQETS_COOKIE }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          STATE_FILE: state.json
        run: |
          git config user.name "tiqets-monitor-bot"
          git config user.email "tiqets-monitor-bot@users.noreply.github.com"

          # Exécuter le script de monitoring
          bash ./monitor-tiqets.sh

          # Commit/push des changements (state.json, data, etc.)
          git add data/ state.json || true
          git diff --staged --quiet || git commit -m "chore(data): update Tiqets monitor"
          git push || true